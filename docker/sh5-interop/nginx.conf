user nginx;
worker_processes 2;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream clean_rosbridge { server unix:/relay/7090.sock; }
  upstream clean_data { server unix:/relay/7082.sock; }
  upstream clean_video { server unix:/relay/7085.sock; }
  upstream clean_preview { server unix:/relay/7086.sock; }
  upstream clean_supervisor { server unix:/relay/7100.sock; }
  server {
    listen 127.0.0.1:17080;
    listen 192.168.6.2:17080;
    root /ui;
    index index.html;
    add_header X-Cyclo-Environment clean-sh5-domain-174 always;
    location = /cyclo-config.js {
      alias /web/cyclo-config.js;
      add_header Cache-Control no-store;
    }
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control no-store;
    }
    location /urdf/ {
      alias /robot-configs/;
      add_header Access-Control-Allow-Origin *;
      types { application/xml urdf; model/stl stl; }
    }
    location /files/workspace/ {
      alias /workspace/;
      add_header Access-Control-Allow-Origin *;
    }
    location /data-api/ {
      proxy_pass http://clean_data/;
      proxy_read_timeout 120s;
      proxy_buffering off;
    }
    location /api/ {
      proxy_pass http://clean_supervisor/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 390s;
      proxy_buffering off;
    }
  }
  server {
    listen 127.0.0.1:17090;
    listen 192.168.6.2:17090;
    location / {
      proxy_pass http://clean_rosbridge;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
  }
  server {
    listen 127.0.0.1:17082;
    # Cyclo's replay response advertises video port 7082.
    listen 192.168.6.2:7082;
    location / {
      proxy_pass http://clean_data;
      proxy_read_timeout 120s;
      proxy_buffering off;
    }
  }
  server {
    listen 127.0.0.1:17085;
    listen 192.168.6.2:17085;
    location / {
      proxy_pass http://clean_video;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }
  }
  server {
    listen 127.0.0.1:17086;
    listen 192.168.6.2:17086;
    location / {
      proxy_pass http://clean_preview;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }
  }
}
