name: CI

on:
  push:
    branches: [main, jazzy]
  pull_request:
    branches: [main, jazzy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submodule-check:
    name: Submodule check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodules are pinned and clean
        shell: bash
        run: |
          set -euo pipefail
          git submodule status --recursive
          if git submodule status --recursive | grep -E '^[+-]'; then
            echo "Submodule checkout is missing or not at the pinned commit." >&2
            exit 1
          fi
          git diff --submodule=short --exit-code

  ros-ci:
    name: ROS_CI (jazzy)
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:noble
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Create focused ROS workspace
        run: |
          set -euo pipefail
          mkdir -p ros_ws/src
          ln -s "${GITHUB_WORKSPACE}/repo/orchestrator" ros_ws/src/orchestrator
          ln -s "${GITHUB_WORKSPACE}/repo/cyclo_data" ros_ws/src/cyclo_data
          ln -s "${GITHUB_WORKSPACE}/repo/cyclo_data/recorder/rosbag_recorder" ros_ws/src/rosbag_recorder
          ln -s "${GITHUB_WORKSPACE}/repo/interfaces" ros_ws/src/interfaces
          ln -s "${GITHUB_WORKSPACE}/repo/shared" ros_ws/src/shared

      - name: Install ROS and Python dependencies
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          set -u
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3-pip
          rosdep update
          rosdep install \
            --from-paths ros_ws/src \
            --ignore-src \
            --rosdistro jazzy \
            -y -r
          rosdep check \
            --from-paths ros_ws/src \
            --ignore-src \
            --rosdistro jazzy
          python3 -m pip install --no-cache-dir --break-system-packages \
            setuptools==68.1.2 \
            'numpy<2' \
            huggingface_hub \
            matplotlib \
            mcap \
            mcap-ros2-support \
            pandas \
            pillow \
            psutil \
            pyarrow \
            pytest \
            pyyaml

      - name: Build ROS packages
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          set -u
          cd ros_ws
          colcon build \
            --symlink-install \
            --paths \
              src/orchestrator \
              src/cyclo_data \
              src/rosbag_recorder \
              src/interfaces \
              src/shared \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

  ui-build:
    name: UI build
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: orchestrator/ui/package-lock.json

      - name: Install dependencies
        working-directory: orchestrator/ui
        run: npm ci --legacy-peer-deps

      - name: Build UI
        working-directory: orchestrator/ui
        run: npm run build
